meta:
  name: Basic Brain
  type: BrainOld
  author: Asher Vollmer

variables:
  - TARGET

rootNode:
  type: Selector
  children:
  - name: Melee Attack
    type: Sequence
    children:
    - type: FindClosestEnemy 
      save_entity: TARGET
    - type: MoveTo
      entity: TARGET
      accel: 200
      maxSpeed: 50
      distance: 50
  - type: Sequence
    name: Wander
    children:
    - type: SetAnimation
      anim: Walk  # Set animation to walking when wandering
    - type: Wander
      accel: 200
      maxSpeed: 50
      stopDist: 10
      minSpeed: 50
