<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Hello Sprite</title>
  <link rel="modulepreload" href="./_framework/dotnet.js">
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #status { position: absolute; inset: 0; display: grid; place-items: center; color: #aaa; font: 16px system-ui, sans-serif; }
    #status.error { color: #f66; padding: 16px; }
  </style>
</head>
<body>
  <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
  <div id="status">Loading…</div>
  <script type="module" src="./main.js"></script>
</body>
</html>
